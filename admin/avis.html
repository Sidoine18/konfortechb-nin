<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Avis clients — Dashboard KONFORTECH BÉNIN</title>
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <div class="mobile-topbar"><button id="mobile-nav-toggle">☰</button><strong>KONFORTECH BÉNIN</strong><span></span></div>
  <div class="app-shell">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div>
      <div class="topbar"><h1>Avis clients</h1><div class="who" id="admin-who"></div></div>
      <div class="content">
        <div class="tab-row">
          <button id="tab-pending" class="active">En attente</button>
          <button id="tab-approved">Publiés</button>
        </div>
        <p class="hint-text" style="margin-bottom:14px">Règle de la plateforme : aucun avis n'est jamais publié automatiquement.</p>
        <div id="list" style="display:grid;gap:14px"><p class="loading-row">Chargement…</p></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from "./assets/auth-guard.js";
    import { db } from "./assets/firebase-init.js";
    import { collection, onSnapshot, orderBy, query, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    let allItems = [];
    let tab = "pending";
    function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

    function render() {
      const items = allItems.filter((t) => tab === "pending" ? !t.approved : t.approved);
      const list = document.getElementById("list");
      if (items.length === 0) { list.innerHTML = `<div class="empty-module"><h3>Rien ici pour l'instant</h3></div>`; return; }
      list.innerHTML = items.map((t) => `
        <div class="panel" style="margin-bottom:0" data-id="${t.id}">
          <div style="display:flex;justify-content:space-between">
            <div>
              <strong>${esc(t.nom)}</strong> ${t.entreprise ? `<span style="color:#7A8492">· ${esc(t.entreprise)}</span>` : ""}
              <div style="color:var(--orange)">${"★".repeat(t.note || 0)}${"☆".repeat(5 - (t.note || 0))}</div>
            </div>
            <span class="badge ${t.approved ? "badge-approved" : "badge-pending"}">${t.approved ? "Publié" : "En attente"}</span>
          </div>
          <p style="margin-top:10px">${esc(t.commentaire)}</p>
          <div style="display:flex;gap:8px">
            ${!t.approved ? `<button class="btn btn-primary btn-sm" data-action="approve">Approuver</button><button class="btn btn-danger btn-sm" data-action="reject">Refuser</button>` : `<button class="btn btn-outline btn-sm" data-action="unpublish">Dépublier</button>`}
          </div>
        </div>`).join("");

      list.querySelectorAll("[data-action='approve']").forEach((b) => b.addEventListener("click", (e) => updateDoc(doc(db, "testimonials", e.target.closest("[data-id]").dataset.id), { approved: true })));
      list.querySelectorAll("[data-action='unpublish']").forEach((b) => b.addEventListener("click", (e) => updateDoc(doc(db, "testimonials", e.target.closest("[data-id]").dataset.id), { approved: false })));
      list.querySelectorAll("[data-action='reject']").forEach((b) => b.addEventListener("click", (e) => {
        if (!confirm("Refuser (supprimer) cet avis ?")) return;
        deleteDoc(doc(db, "testimonials", e.target.closest("[data-id]").dataset.id));
      }));
    }

    document.getElementById("tab-pending").addEventListener("click", (e) => { tab = "pending"; e.target.classList.add("active"); document.getElementById("tab-approved").classList.remove("active"); render(); });
    document.getElementById("tab-approved").addEventListener("click", (e) => { tab = "approved"; e.target.classList.add("active"); document.getElementById("tab-pending").classList.remove("active"); render(); });

    requireAdmin().then(() => {
      const q = query(collection(db, "testimonials"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snap) => { allItems = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, (err) => {
        console.error(err);
        document.getElementById("list").innerHTML = `<div class="empty-module"><h3>Erreur de chargement</h3><p>${esc(err.code || err.message)}</p><p class="hint-text">Vérifiez que vous êtes bien connecté avec un compte ayant un rôle admin, et que les règles Firestore sont bien déployées (README-ADMIN.md § Dépannage).</p></div>`;
      });
    });
  </script>
</body>
</html>
