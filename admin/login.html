<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Connexion — Dashboard KONFORTECH BÉNIN</title>
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <img src="../assets/img/logo.png" alt="KONFORTECH BÉNIN">
      <h2>Dashboard administrateur</h2>

      <div class="tab-row">
        <button id="tab-login" class="active">Connexion</button>
        <button id="tab-signup">Créer un compte</button>
      </div>

      <!-- Connexion -->
      <form id="login-form">
        <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="li-pass">Mot de passe</label><input id="li-pass" type="password" required autocomplete="current-password"></div>
        <p class="error-text" id="login-error" style="color:red; font-size:13px; margin-top:8px;"></p>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Se connecter</button>
        <button type="button" id="forgot-btn" class="hint-text" style="background:none;border:none;margin-top:12px;text-decoration:underline;padding:0;cursor:pointer">Mot de passe oublié ?</button>
      </form>

      <!-- Création de compte -->
      <form id="signup-form" style="display:none">
        <div class="field"><label for="su-name">Nom complet</label><input id="su-name" required></div>
        <div class="field"><label for="su-email">Email</label><input id="su-email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="su-pass">Mot de passe</label><input id="su-pass" type="password" required minlength="6" autocomplete="new-password"></div>
        <p class="hint-text">Un nouveau compte est créé avec le rôle « client » par sécurité. Pour obtenir l'accès au dashboard, un Super Admin doit changer votre rôle directement dans Firestore (collection <code>users</code>, champ <code>role</code> → <code>superadmin</code>).</p>
        <p class="error-text" id="signup-error" style="color:red; font-size:13px; margin-top:8px;"></p>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:10px">Créer le compte</button>
      </form>

      <p class="success-text" id="global-success" style="color:green; font-size:13px; margin-top:8px;"></p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./assets/firebase-init.js";
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      sendPasswordResetEmail, 
      onAuthStateChanged,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const ALLOWED_ROLES = ["superadmin", "editeur", "commercial", "technicien"];
    let isProcessingSignup = false;

    // Évite les redirections en boucle incontrôlées
    onAuthStateChanged(auth, async (user) => {
      if (user && !isProcessingSignup) {
        try {
          const userSnap = await getDoc(doc(db, "users", user.uid));
          if (userSnap.exists() && ALLOWED_ROLES.includes(userSnap.data().role)) {
            window.location.href = "index.html";
          }
        } catch (e) {
          console.error("Erreur de vérification au chargement :", e);
        }
      }
    });

    // Gestion des onglets Connexion / Inscription
    const tabLogin = document.getElementById("tab-login");
    const tabSignup = document.getElementById("tab-signup");
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");

    tabLogin.addEventListener("click", () => { 
      tabLogin.classList.add("active"); tabSignup.classList.remove("active"); 
      loginForm.style.display = ""; signupForm.style.display = "none"; 
    });

    tabSignup.addEventListener("click", () => { 
      tabSignup.classList.add("active"); tabLogin.classList.remove("active"); 
      signupForm.style.display = ""; loginForm.style.display = "none"; 
    });

    // Formulaire de Connexion
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("li-email").value;
      const pass = document.getElementById("li-pass").value;
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";

      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const userDoc = await getDoc(doc(db, "users", cred.user.uid));

        if (!userDoc.exists()) {
          errorEl.textContent = "Aucun profil utilisateur trouvé dans la base de données.";
          await signOut(auth);
          return;
        }

        const role = userDoc.data().role;
        if (ALLOWED_ROLES.includes(role)) {
          window.location.href = "index.html";
        } else {
          errorEl.textContent = "Accès refusé : votre compte possède le rôle '" + role + "'. Demandez un rôle administrateur à un Super Admin.";
          await signOut(auth);
        }
      } catch (err) {
        console.error("Erreur connexion :", err);
        errorEl.textContent = "Email ou mot de passe incorrect (" + (err.code || err.message) + ").";
      }
    });

    // Envoi email de réinitialisation
    document.getElementById("forgot-btn").addEventListener("click", async () => {
      const email = document.getElementById("li-email").value;
      const errorEl = document.getElementById("login-error");
      if (!email) { errorEl.textContent = "Entrez votre email ci-dessus, puis cliquez à nouveau."; return; }
      try {
        await sendPasswordResetEmail(auth, email);
        document.getElementById("global-success").textContent = "Email de réinitialisation envoyé.";
        errorEl.textContent = "";
      } catch (err) {
        errorEl.textContent = "Impossible d'envoyer l'email de réinitialisation.";
      }
    });

    // Formulaire de Création de compte
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      isProcessingSignup = true;

      const name = document.getElementById("su-name").value;
      const email = document.getElementById("su-email").value;
      const pass = document.getElementById("su-pass").value;
      const errorEl = document.getElementById("signup-error");
      errorEl.textContent = "";

      try {
        // 1. Création de l'utilisateur Firebase Auth
        const cred = await createUserWithEmailAndPassword(auth, email, pass);

        // 2. Écriture directe du profil dans Firestore
        await setDoc(doc(db, "users", cred.user.uid), {
          displayName: name,
          email: email,
          role: "client",
          createdAt: serverTimestamp()
        });

        // 3. Déconnexion automatique
        await signOut(auth);

        alert("Compte créé dans la base de données avec succès ! Changez maintenant le rôle de cet UID en 'superadmin' dans la console Firebase.");
        tabLogin.click();
      } catch (err) {
        console.error("Erreur inscription :", err);
        errorEl.innerHTML = "Erreur lors de la création : <strong>" + (err.code || err.message) + "</strong>";
      } finally {
        isProcessingSignup = false;
      }
    });
  </script>
</body>
</html>
