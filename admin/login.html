<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Connexion — Dashboard KONFORTECH BÉNIN</title>
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="assets/admin.css">
<style>
  /* Styles minimaux ajoutés pour le message de succès et l'état de chargement.
     Si ces classes existent déjà dans admin.css, ce bloc peut être supprimé. */
  .success-text {
    display: none;
    background: #e6f7ec;
    border: 1px solid #34a853;
    color: #1e7e34;
    padding: 12px 14px;
    border-radius: 8px;
    margin-top: 14px;
    font-weight: 600;
    text-align: center;
  }
  .error-text {
    display: none;
    color: #c0392b;
    font-weight: 600;
    margin-top: 8px;
  }
  .error-text:not(:empty), .success-text:not(:empty) { display: block; }
  button[disabled] { opacity: 0.65; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <img src="../assets/img/logo.png" alt="KONFORTECH BÉNIN">
      <h2>Dashboard administrateur</h2>

      <div class="tab-row">
        <button id="tab-login" class="active" type="button">Connexion</button>
        <button id="tab-signup" type="button">Créer un compte</button>
      </div>

      <!-- Connexion -->
      <form id="login-form">
        <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="li-pass">Mot de passe</label><input id="li-pass" type="password" required autocomplete="current-password"></div>
        <p class="error-text" id="login-error"></p>
        <button class="btn btn-primary" type="submit" id="login-submit-btn" style="width:100%;justify-content:center">Se connecter</button>
        <button type="button" id="forgot-btn" class="hint-text" style="background:none;border:none;margin-top:12px;text-decoration:underline;padding:0;cursor:pointer">Mot de passe oublié ?</button>
      </form>

      <!-- Création de compte -->
      <form id="signup-form" style="display:none">
        <div class="field"><label for="su-name">Nom complet</label><input id="su-name" required></div>
        <div class="field"><label for="su-email">Email</label><input id="su-email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="su-pass">Mot de passe</label><input id="su-pass" type="password" required minlength="6" autocomplete="new-password"></div>
        <p class="hint-text">Un nouveau compte est créé avec le rôle « client » par sécurité. Pour obtenir l'accès au dashboard, un Super Admin doit changer votre rôle directement dans Firestore (collection <code>users</code>, champ <code>role</code> → <code>superadmin</code> / <code>editeur</code> / <code>commercial</code> / <code>technicien</code>).</p>
        <p class="error-text" id="signup-error"></p>
        <button class="btn btn-primary" type="submit" id="signup-submit-btn" style="width:100%;justify-content:center;margin-top:10px">Créer le compte</button>
      </form>

      <p class="success-text" id="global-success"></p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./assets/firebase-init.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const ALLOWED_ROLES = ["superadmin", "editeur", "commercial", "technicien"];

    // ---- Garde anti-redirection prématurée pendant le flux d'inscription ----
    // onAuthStateChanged se déclenche dès que createUserWithEmailAndPassword
    // réussit (l'utilisateur est alors automatiquement connecté par Firebase).
    // On doit donc pouvoir "mettre en pause" cette redirection tant que
    // l'écriture Firestore + le signOut ne sont pas terminés.
    let suppressAuthRedirect = false;

    onAuthStateChanged(auth, (user) => {
      if (suppressAuthRedirect) return;
      if (user) window.location.href = "index.html";
    });

    // ---- Onglets ----
    const tabLogin = document.getElementById("tab-login");
    const tabSignup = document.getElementById("tab-signup");
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const globalSuccess = document.getElementById("global-success");

    function activateLoginTab() {
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      loginForm.style.display = "";
      signupForm.style.display = "none";
    }
    function activateSignupTab() {
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      signupForm.style.display = "";
      loginForm.style.display = "none";
    }

    tabLogin.addEventListener("click", () => { activateLoginTab(); globalSuccess.textContent = ""; });
    tabSignup.addEventListener("click", () => { activateSignupTab(); globalSuccess.textContent = ""; });

    // ---- Connexion ----
    const loginSubmitBtn = document.getElementById("login-submit-btn");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("li-email").value;
      const pass = document.getElementById("li-pass").value;
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      globalSuccess.textContent = "";

      loginSubmitBtn.disabled = true;
      const originalLabel = loginSubmitBtn.textContent;
      loginSubmitBtn.textContent = "Connexion en cours...";

      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const uid = cred.user.uid;

        // On lit le rôle AVANT de laisser onAuthStateChanged rediriger,
        // pour pouvoir refuser l'accès si le rôle n'est pas autorisé.
        suppressAuthRedirect = true;

        const userSnap = await getDoc(doc(db, "users", uid));
        const role = userSnap.exists() ? userSnap.data().role : undefined;

        if (ALLOWED_ROLES.includes(role)) {
          suppressAuthRedirect = false;
          window.location.href = "index.html";
        } else {
          await signOut(auth);
          errorEl.textContent = "Accès refusé : votre compte n'a pas les privilèges administrateur (Rôle actuel : "
            + (role || "non défini") + ").";
          suppressAuthRedirect = false;
        }
      } catch (err) {
        errorEl.textContent = ["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found"].includes(err.code)
          ? "Email ou mot de passe incorrect."
          : "Connexion impossible (" + (err.code || err.message) + ").";
        suppressAuthRedirect = false;
      } finally {
        loginSubmitBtn.disabled = false;
        loginSubmitBtn.textContent = originalLabel;
      }
    });

    document.getElementById("forgot-btn").addEventListener("click", async () => {
      const email = document.getElementById("li-email").value;
      const errorEl = document.getElementById("login-error");
      if (!email) { errorEl.textContent = "Entrez votre email ci-dessus, puis cliquez à nouveau."; return; }
      try {
        await sendPasswordResetEmail(auth, email);
        globalSuccess.textContent = "Email de réinitialisation envoyé.";
        errorEl.textContent = "";
      } catch {
        errorEl.textContent = "Impossible d'envoyer l'email de réinitialisation.";
      }
    });

    // ---- Inscription ----
    const signupSubmitBtn = document.getElementById("signup-submit-btn");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("su-name").value;
      const email = document.getElementById("su-email").value;
      const pass = document.getElementById("su-pass").value;
      const errorEl = document.getElementById("signup-error");
      errorEl.textContent = "";
      globalSuccess.textContent = "";

      // a) État de chargement / bouton désactivé pour éviter le double-clic.
      signupSubmitBtn.disabled = true;
      const originalLabel = signupSubmitBtn.textContent;
      signupSubmitBtn.textContent = "Création en cours...";

      // On désactive la redirection auto AVANT de créer le compte, car
      // createUserWithEmailAndPassword connecte immédiatement l'utilisateur
      // et déclenche onAuthStateChanged.
      suppressAuthRedirect = true;

      let cred;
      try {
        // b) Création de l'utilisateur dans Firebase Authentication.
        cred = await createUserWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        errorEl.textContent = err.code === "auth/email-already-in-use"
          ? "Un compte existe déjà avec cet email."
          : "Impossible de créer le compte (" + (err.code || err.message) + ").";
        suppressAuthRedirect = false;
        signupSubmitBtn.disabled = false;
        signupSubmitBtn.textContent = originalLabel;
        return;
      }

      try {
        // c) Écriture synchrone du document Firestore users/{uid}.
        await setDoc(doc(db, "users", cred.user.uid), {
          displayName: name,
          email: email,
          role: "client",
          createdAt: serverTimestamp(),
        });
      } catch (err) {
        errorEl.innerHTML = "Le compte de connexion a été créé (visible dans Firebase → Authentication), "
          + "mais l'enregistrement du profil dans Firestore a échoué : <strong>" + (err.code || err.message) + "</strong>.<br>"
          + "Cause la plus probable : la base Firestore n'a pas encore été créée dans la console Firebase, "
          + "ou les règles de sécurité (firestore.rules) n'ont pas été déployées. Voir README-ADMIN.md § Dépannage.";
        suppressAuthRedirect = false;
        signupSubmitBtn.disabled = false;
        signupSubmitBtn.textContent = originalLabel;
        return;
      }

      // d) Déconnexion immédiate de l'utilisateur nouvellement créé.
      try {
        await signOut(auth);
      } catch {
        // Non bloquant : même si signOut échoue, on continue le flux visuel ;
        // onAuthStateChanged restera de toute façon suppressé jusqu'à la
        // réinitialisation ci-dessous.
      }

      // e) Message de succès visible.
      globalSuccess.textContent = "Votre compte a été créé avec succès dans la base de données ! Vous allez être redirigé vers l'écran de connexion.";
      signupSubmitBtn.textContent = originalLabel;

      // f) Après 2-3 secondes : réinitialisation du formulaire + bascule sur l'onglet Connexion.
      setTimeout(() => {
        signupForm.reset();
        signupSubmitBtn.disabled = false;
        globalSuccess.textContent = "";
        activateLoginTab();
        suppressAuthRedirect = false; // on réactive l'écoute normale
      }, 2500);
    });
  </script>
</body>
</html>
